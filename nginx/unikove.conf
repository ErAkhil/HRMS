# ─── Rate-limit zones ─────────────────────────────────────────────────────────
# Shared memory for IP-based rate limiting (survives Nginx reloads)
limit_req_zone $binary_remote_addr zone=api_login:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=web:10m         rate=200r/m;

# ─── Upstream pools ───────────────────────────────────────────────────────────
upstream nestjs {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream nextjs {
    # Add more lines here when running Next.js in PM2 cluster mode
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;

    # SSL certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS (enable after confirming SSL is working)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options           DENY        always;
    add_header X-Content-Type-Options    nosniff     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Compression ───────────────────────────────────────────────
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ── Client limits ─────────────────────────────────────────────
    client_max_body_size 10M;

    # ─────────────────────────────────────────────────────────────
    # 1. Auth login endpoint — strict rate limit (10 req/min per IP)
    # ─────────────────────────────────────────────────────────────
    location = /api/auth/login {
        limit_req zone=api_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ─────────────────────────────────────────────────────────────
    # 2. REST API — general rate limit
    # ─────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://nestjs;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────────────────────────────
    # 3. WebSocket (Socket.io) — no rate limit, long-lived connection
    # ─────────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://nestjs;
        proxy_http_version 1.1;

        # WebSocket upgrade handshake
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep the WS connection alive for up to 1 hour of inactivity
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ─────────────────────────────────────────────────────────────
    # 4. Next.js static assets — serve with long cache TTL
    # ─────────────────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────
    # 5. Public static files (images, fonts, favicons)
    # ─────────────────────────────────────────────────────────────
    location /images/ {
        proxy_pass http://nextjs;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────
    # 6. Everything else → Next.js
    # ─────────────────────────────────────────────────────────────
    location / {
        limit_req zone=web burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
